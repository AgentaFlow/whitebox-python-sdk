[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whitebox-xai-sdk"
version = "1.1.0"
description = "Python SDK for WhiteBox XAI - AI Observability & Explainability Platform"
readme = "README.md"
authors = [
    {name = "WhiteBoxXAI Team", email = "support@whiteboxxai.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["machine-learning", "explainability", "monitoring", "observability", "xai", "mlops"]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
sklearn = ["scikit-learn>=1.0.0"]
pytorch = ["torch>=2.0.0"]
tensorflow = ["tensorflow>=2.10.0"]
xgboost = ["xgboost>=1.7.0"]
lightgbm = ["lightgbm>=4.0.0"]
huggingface = ["transformers>=4.30.0"]
langchain = ["langchain>=0.1.0"]
all = [
    "scikit-learn>=1.0.0",
    "torch>=2.0.0",
    "tensorflow>=2.10.0",
    "xgboost>=1.7.0",
    "lightgbm>=4.0.0",
    "transformers>=4.30.0",
    "langchain>=0.1.0",
]

[project.urls]
Homepage = "https://whiteboxxai.com"
Documentation = "https://docs.whiteboxxai.com/sdk"

[tool.setuptools.packages.find]
where = ["."]
include = ["whiteboxxai*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=whiteboxxai --cov-report=html --cov-report=term"
