[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whiteboxai-sdk"
version = "0.2.0"
description = "Official Python SDK for WhiteBoxAI - ML Monitoring and Observability"
readme = "README.md"
authors = [
    {name = "AgentaFlow", email = "support@agentaflow.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["machine-learning", "explainability", "monitoring", "observability", "xai", "mlops", "whiteboxai"]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "pandas>=1.3.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "pylint>=3.0.0",
    "mypy>=1.7.0",
    "bandit>=1.7.5",
]
git = ["gitpython>=3.1.0"]
sklearn = ["scikit-learn>=1.3.0"]
pytorch = ["torch>=2.0.0"]
tensorflow = ["tensorflow>=2.13.0"]
transformers = ["transformers>=4.30.0"]
langchain = ["langchain>=0.0.200"]
crewai = ["crewai>=0.1.0"]
boosting = ["xgboost>=1.7.0", "lightgbm>=4.0.0"]
all = [
    "gitpython>=3.1.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "tensorflow>=2.13.0",
    "transformers>=4.30.0",
    "langchain>=0.0.200",
    "crewai>=0.1.0",
    "xgboost>=1.7.0",
    "lightgbm>=4.0.0",
]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pylint.messages_control]
disable = "C0330, C0326"

[tool.pylint.format]
max-line-length = "120"

[tool.coverage.run]
source = ["src/whiteboxai"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[project.urls]
Homepage = "https://whitebox.agentaflow.com"
Documentation = "https://whitebox.agentaflow.com/docs"
Repository = "https://github.com/AgentaFlow/whitebox-python-sdk"
"Bug Tracker" = "https://github.com/AgentaFlow/whitebox-python-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["whiteboxai*"]
